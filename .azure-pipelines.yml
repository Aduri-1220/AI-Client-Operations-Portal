trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  ACR_NAME: 'aiopsportalacr'
  RESOURCE_GROUP: 'aiops-portal-rg'
  ACI_API: 'aiops-api-dev'
  ACI_WEB: 'aiops-web-dev'

stages:
  - stage: Lint
    displayName: 'Lint & Type Check'
    jobs:
      - job: LintFrontend
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: '20.x' }
          - script: npm ci && npm run lint
            workingDirectory: apps/web
            displayName: 'Lint frontend'
      - job: LintBackend
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: '20.x' }
          - script: npm ci && npm run lint
            workingDirectory: apps/api
            displayName: 'Lint backend'

  - stage: Test
    displayName: 'Unit & Integration Tests'
    dependsOn: Lint
    jobs:
      - job: TestBackend
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: '20.x' }
          - script: npm ci && npm test -- --passWithNoTests --coverage
            workingDirectory: apps/api
            displayName: 'Run backend tests'
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'apps/api/test-results/*.xml'
      - job: TestDotnet
        steps:
          - task: UseDotNet@2
            inputs: { version: '8.x' }
          - script: dotnet test
            workingDirectory: apps/dotnet-service/ReportsService
            displayName: 'Run .NET tests'

  - stage: E2E
    displayName: 'Playwright E2E Tests'
    dependsOn: Test
    jobs:
      - job: PlaywrightTests
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: '20.x' }
          - script: npm ci
            workingDirectory: apps/web
            displayName: 'Install web dependencies (needed by webServer)'
          - script: npm ci && npx playwright install --with-deps
            workingDirectory: tests/e2e
            displayName: 'Install Playwright'
          - script: npm test
            workingDirectory: tests/e2e
            displayName: 'Run E2E tests'
            env:
              TF_BUILD: 'true'
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'tests/e2e/results/junit.xml'

  - stage: Build
    displayName: 'Build Docker Images'
    dependsOn: E2E
    jobs:
      - job: BuildImages
        steps:
          - task: AzureCLI@2
            displayName: 'Build & push all images'
            inputs:
              azureSubscription: 'AzureServiceConnection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -ex
                ACR="$(ACR_NAME).azurecr.io"
                az acr login --name $(ACR_NAME)

                docker build -t "$ACR/api:$(Build.BuildId)" -t "$ACR/api:latest" -f apps/api/Dockerfile apps/api
                docker push "$ACR/api:$(Build.BuildId)"
                docker push "$ACR/api:latest"

                docker build -t "$ACR/web:$(Build.BuildId)" -t "$ACR/web:latest" -f apps/web/Dockerfile apps/web
                docker push "$ACR/web:$(Build.BuildId)"
                docker push "$ACR/web:latest"

                docker build -t "$ACR/reports:$(Build.BuildId)" -t "$ACR/reports:latest" -f apps/dotnet-service/ReportsService/Dockerfile apps/dotnet-service/ReportsService
                docker push "$ACR/reports:$(Build.BuildId)"
                docker push "$ACR/reports:latest"

                echo "=== Images in ACR ==="
                az acr repository list --name $(ACR_NAME) -o table
                az acr repository show-tags --name $(ACR_NAME) --repository api -o table

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployAzure
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: 'Deploy Bicep infra'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az deployment group create \
                        --resource-group $(RESOURCE_GROUP) \
                        --template-file infra/bicep/main.bicep \
                        --parameters environment=dev
                - task: AzureCLI@2
                  displayName: 'Deploy ACI containers'
                  inputs:
                    azureSubscription: 'AzureServiceConnection'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -ex
                      ACR_SERVER="$(ACR_NAME).azurecr.io"

                      echo "Fetching ACR credentials..."
                      ACR_USER=$(az acr credential show --name $(ACR_NAME) --resource-group $(RESOURCE_GROUP) --query username -o tsv)
                      ACR_PASS=$(az acr credential show --name $(ACR_NAME) --resource-group $(RESOURCE_GROUP) --query "passwords[0].value" -o tsv)
                      echo "ACR_USER=$ACR_USER"

                      echo "Deploying API container..."
                      az container create \
                        --name $(ACI_API) \
                        --resource-group $(RESOURCE_GROUP) \
                        --image "$ACR_SERVER/api:$(Build.BuildId)" \
                        --registry-login-server "$ACR_SERVER" \
                        --registry-username "$ACR_USER" \
                        --registry-password "$ACR_PASS" \
                        --ports 3001 \
                        --os-type Linux \
                        --environment-variables NODE_ENV=production PORT=3001 \
                        --cpu 1 --memory 2 \
                        --no-wait

                      echo "Deploying Web container..."
                      az container create \
                        --name $(ACI_WEB) \
                        --resource-group $(RESOURCE_GROUP) \
                        --image "$ACR_SERVER/web:$(Build.BuildId)" \
                        --registry-login-server "$ACR_SERVER" \
                        --registry-username "$ACR_USER" \
                        --registry-password "$ACR_PASS" \
                        --ports 3000 \
                        --os-type Linux \
                        --environment-variables NODE_ENV=production \
                        --cpu 1 --memory 2 \
                        --no-wait

                      echo "Container deployment submitted."
